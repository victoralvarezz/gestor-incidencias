
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Panel de control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Resumen de incidencias</h1>
  <p>Consulta el estado general de las incidencias.</p>

  <ion-grid>
    <ion-row>

      <ion-col size="12" sizeMd="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Total</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h2>{{ servicio.total() }}</h2>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Pendientes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h2>{{ servicio.pendientes() }}</h2>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Resueltas</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h2>{{ servicio.resueltas() }}</h2>
          </ion-card-content>
        </ion-card>
      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
