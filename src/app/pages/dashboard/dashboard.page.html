
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Panel de control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Resumen de incidencias</h1>
  <p>Consulta el estado general de las incidencias.</p>

  <ion-grid>
    <ion-row>

      <ion-col size="12" sizeMd="4">
        <app-tarjeta-resumen titulo="Total" [cantidad]="servicio.total()"
          (pulsada)="verIncidencias()"></app-tarjeta-resumen>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <app-tarjeta-resumen titulo="Pendientes" [cantidad]="servicio.pendientes()"
          (pulsada)="verIncidencias()"></app-tarjeta-resumen>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <app-tarjeta-resumen titulo="Resueltas" [cantidad]="servicio.resueltas()"
          (pulsada)="verIncidencias()"></app-tarjeta-resumen>
      </ion-col>

    </ion-row>
  </ion-grid>

  <section class="grafico" aria-label="Gráfico de incidencias por estado">
    <h2>Incidencias por estado</h2>
    @for (barra of grafico(); track barra.estado) {
      <div class="fila-grafico">
        <span>{{ barra.estado }}</span>
        <div class="pista">
          <div class="barra" [class.en-proceso]="barra.estado === 'En proceso'"
            [class.resuelta]="barra.estado === 'Resuelta'"
            [style.width.%]="barra.porcentaje"></div>
        </div>
        <strong>{{ barra.cantidad }}</strong>
      </div>
    }
  </section>

  <div class="acciones">
    <ion-button (click)="exportarCsv()">Descargar CSV</ion-button>
  </div>

</ion-content>
