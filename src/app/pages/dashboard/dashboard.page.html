
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Panel de control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Resumen de incidencias</h1>
  <p>Consulta el estado general de las incidencias.</p>

  <ion-grid>
    <ion-row>

      <ion-col size="12" sizeMd="4">
        <app-tarjeta-resumen titulo="Total" [cantidad]="servicio.total()"
          (pulsada)="verIncidencias()"></app-tarjeta-resumen>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <app-tarjeta-resumen titulo="Pendientes" [cantidad]="servicio.pendientes()"
          (pulsada)="verIncidencias()"></app-tarjeta-resumen>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <app-tarjeta-resumen titulo="Resueltas" [cantidad]="servicio.resueltas()"
          (pulsada)="verIncidencias()"></app-tarjeta-resumen>
      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
