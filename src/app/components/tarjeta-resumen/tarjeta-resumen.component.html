<ion-card>
  <ion-card-header>
    <ion-card-title>{{ titulo }}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <h2>{{ cantidad }}</h2>
    <ion-button fill="clear" [attr.aria-label]="'Ver incidencias: ' + titulo" (click)="pulsada.emit()">Ver incidencias</ion-button>
  </ion-card-content>
</ion-card>
