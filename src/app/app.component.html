<ion-app>
  <ion-split-pane contentId="main-content">

    @if (auth.estaAutenticado()) {
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list>

          <ion-list-header>
            Gestor de Incidencias
          </ion-list-header>

          <ion-note>
            Aplicación de gestión
          </ion-note>

          @for (pagina of appPages; track pagina.title) {
            <ion-menu-toggle autoHide="false">
              <ion-item
                [routerLink]="[pagina.url]"
                routerLinkActive="selected"
                routerDirection="root"
                lines="none"
                detail="false">

                <ion-icon
                  slot="start"
                  [name]="pagina.icon + '-outline'">
                </ion-icon>

                <ion-label>
                  {{ pagina.title }}
                </ion-label>

              </ion-item>
            </ion-menu-toggle>
          }

        </ion-list>
        <ion-button expand="block" fill="clear" (click)="cerrarSesion()">
          Cerrar sesión
        </ion-button>
      </ion-content>
    </ion-menu>
    }

    <ion-router-outlet id="main-content">
    </ion-router-outlet>

  </ion-split-pane>
</ion-app>
